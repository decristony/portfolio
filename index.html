<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony (Decristony) — Web designer e desenvolvedor front-end</title>
    <meta
      name="description"
      content="Portfólio de Tony (Decristony), web designer e desenvolvedor front-end em Brasília. Sites conceituais da OrvionWeb para clínicas e profissionais de saúde."
    />
    <meta name="theme-color" content="#ECECEC" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- fontes da primeira tela: começam a baixar junto com o HTML -->
    <link rel="preload" href="/fonts/pczyWZYmicHp9LhGgMJo7tnDcHo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/xirQ3g4Sv5q7MG0KvL1PiOOLLBA.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Abertura primeiro: decide antes do primeiro quadro se a abertura aparece
      (primeira visita da sessão). O primeiro quadro já é a página clara dela,
      e intro.js (defer, antes do bundle) começa a abertura sem esperar o React.
      O site carrega por trás e só aparece pela bolha.
    -->
    <script>
      (function () {
        var seen = false;
        try { seen = sessionStorage.getItem('orvion:intro-seen') === '1'; } catch (e) {}
        if (!seen) document.documentElement.classList.add('intro-on');
      })();
    </script>
    <style>
      html.intro-on, html.intro-on body { background: #f0f0ea; }
      html.intro-on #root { pointer-events: none; }
    </style>
    <link rel="stylesheet" href="%BASE_URL%intro/intro.css" />
    <script src="%BASE_URL%intro/intro.js" defer onerror="document.documentElement.classList.remove('intro-on')"></script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Tony (Decristony) — Web designer e desenvolvedor front-end" />
    <meta
      property="og:description"
      content="Sites conceituais da OrvionWeb para clínicas e profissionais de saúde: identidade, design e código."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
